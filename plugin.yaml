name: peer-messaging
version: 0.6.0
manifest_version: 2
api_version: 1
description: Local Hermes conversations and their delegated teams coordinate through linked threads and durable inboxes without waking idle agents.
license: MIT
author: Xipong
provides_tools:
  - peer_sessions
  - peer_send
  - peer_receive
  - list_threads
  - link_thread
  - read_thread
  - wait_threads
  - create_thread
provides_hooks:
  - pre_llm_call
  - transform_tool_result
