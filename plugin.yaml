name: peer-messaging
version: 0.4.0
manifest_version: 2
api_version: 1
description: Local Hermes conversations and their delegated teams coordinate through linked threads and durable inboxes without waking idle agents.
license: MIT
author: Xipong
provides_tools:
  - peer_sessions
  - peer_send
  - peer_receive
  - list_threads
  - link_thread
  - read_thread
  - send_message_to_thread
  - wait_threads
  - create_thread
  - message_peer
provides_hooks:
  - pre_llm_call
  - subagent_start
  - transform_tool_result
